name: CI - scheduling-engine

permissions:
  contents: read

on:
  push:
    paths:
      - 'services/scheduling-engine/**'
      - 'contracts/**'
  pull_request:
    paths:
      - 'services/scheduling-engine/**'
      - 'contracts/**'

jobs:
  test:
    name: scheduling-engine tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect test tooling
        id: detect
        run: |
          if [ -f "services/scheduling-engine/package.json" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify lockfile present
        if: steps.detect.outputs.found == 'true'
        run: |
          if [ ! -f "services/scheduling-engine/package-lock.json" ]; then
            echo "::error::services/scheduling-engine/package.json exists but package-lock.json is missing. npm ci requires a committed lockfile - run 'npm install' locally and commit the result."
            exit 1
          fi

      - name: Set up Node.js
        if: steps.detect.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/scheduling-engine/package-lock.json

      - name: Install dependencies
        if: steps.detect.outputs.found == 'true'
        working-directory: services/scheduling-engine
        run: npm ci

      - name: Run tests
        if: steps.detect.outputs.found == 'true'
        working-directory: services/scheduling-engine
        run: npm test

      - name: No test tooling configured yet
        if: steps.detect.outputs.found == 'false'
        run: echo "no test tooling configured yet for scheduling-engine - skipping"
