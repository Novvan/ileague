name: CI - scheduling-engine

permissions:
  contents: read

on:
  push:
    paths:
      - 'services/scheduling-engine/**'
      - 'contracts/**'
  pull_request:
    paths:
      - 'services/scheduling-engine/**'
      - 'contracts/**'

jobs:
  test:
    name: scheduling-engine tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect test tooling
        id: detect
        run: |
          if [ -f "services/scheduling-engine/deno.json" ] || [ -f "services/scheduling-engine/deno.jsonc" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Deno
        if: steps.detect.outputs.found == 'true'
        uses: denoland/setup-deno@v2
        with:
          deno-version: lts
          cache: true

      - name: Run tests
        if: steps.detect.outputs.found == 'true'
        working-directory: services/scheduling-engine
        run: deno test -A

      - name: No test tooling configured yet
        if: steps.detect.outputs.found == 'false'
        run: echo "no test tooling configured yet for scheduling-engine - skipping"
