name: CI - supabase-infra

on:
  push:
    paths:
      - 'services/supabase-infra/**'
      - 'contracts/**'
  pull_request:
    paths:
      - 'services/supabase-infra/**'
      - 'contracts/**'

jobs:
  test:
    name: supabase-infra tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect test tooling
        id: detect
        run: |
          if [ -f "services/supabase-infra/package.json" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.detect.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/supabase-infra/package-lock.json

      - name: Install dependencies
        if: steps.detect.outputs.found == 'true'
        working-directory: services/supabase-infra
        run: npm ci

      - name: Run tests
        if: steps.detect.outputs.found == 'true'
        working-directory: services/supabase-infra
        run: npm test

      - name: No test tooling configured yet
        if: steps.detect.outputs.found == 'false'
        run: echo "no test tooling configured yet for supabase-infra - skipping"
